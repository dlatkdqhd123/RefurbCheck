name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and lint
        run: bash ./gradlew --no-daemon assembleDebug lintDebug
      - name: Conservative audit rule tests
        run: |
          mkdir -p build/rule-tests
          javac -encoding UTF-8 --release 17 -d build/rule-tests app/src/main/java/io/github/dlatkdqhd123/refurbcheck/prototype/AuditRules.java tests/AuditRulesTest.java
          java -cp build/rule-tests io.github.dlatkdqhd123.refurbcheck.prototype.AuditRulesTest
      - uses: actions/upload-artifact@v4
        with:
          name: RefurbCheck-prototype-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
