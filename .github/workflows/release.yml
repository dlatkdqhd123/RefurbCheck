name: Verify and prepare RefurbCheck 1.4.0 draft
on:
  push:
    branches: ['release/1.4.0']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: refurbcheck-release-v1.4.0
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REFURBCHECK_TEST_APK: ${{ github.workspace }}/release/RefurbCheck-1.4.0.apk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK and source verification
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          python3 tools/verify_release_inputs.py
          echo '56d9586b825520a9b1fe7d443d1398f4879a3e1eed6fa90b995293e9ad54ca59  release/RefurbCheck-1.4.0.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/RefurbCheck-1.4.0.apk > signature-check.txt
          # Keep the exact published v1.3 APK as the in-place upgrade fixture.
          echo '2d1b2c0d1222cf5089c0a30a10a81f884f8286f7b86cf214f82bb7f089f7efc8  release/RefurbCheck-1.3.0.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/RefurbCheck-1.3.0.apk > upgrade-source-signature-check.txt
          python3 - <<'PYVERIFY'
          from pathlib import Path
          for report in ('signature-check.txt', 'upgrade-source-signature-check.txt'):
              text=Path(report).read_text()
              assert 'Signer #1 certificate SHA-256 digest: d02b8c5cbcde0ad3fbd3eb9e4c66e28094a27cf4f7a8472d309f84d825184ceb' in text
              assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in text
              assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in text
              assert 'Number of signers: 1' in text
          PYVERIFY
      - name: Host regression tests
        run: bash tests/run_all_tests.sh | tee host-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RefurbCheck-1.4-host-validation
          path: |
            host-tests.txt
            signature-check.txt
            upgrade-source-signature-check.txt
          retention-days: 30
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - name: Exercise one-run flow and in-place upgrade on Android
        run: bash tests/android-v14/run_ci.sh '${{ matrix.api }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RefurbCheck-1.4-android-${{ matrix.api }}-validation
          path: build/runtime-results
          if-no-files-found: warn
          retention-days: 30
  release:
    needs: [verify, android]
    if: github.repository == 'dlatkdqhd123/RefurbCheck' && github.ref == 'refs/heads/release/1.4.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive exact verified source
        run: |
          python3 tools/verify_release_inputs.py
          git archive --format=zip --prefix=RefurbCheck-1.4.0/ --output="$RUNNER_TEMP/RefurbCheck-1.4.0-source.zip" "$GITHUB_SHA"
      - name: Prepare draft for user review only after both Android jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing_release="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.4.0") | .id')"
          existing_tag="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v1.4.0" --jq '.[] | select(.ref == "refs/tags/v1.4.0") | .ref')"
          if [ -n "$existing_release" ] || [ -n "$existing_tag" ]; then
            echo 'v1.4.0 already exists; refusing to replace its release/tag.'
            exit 1
          fi
          created_sha="$(gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.4.0' -f "sha=$GITHUB_SHA" --jq '.object.sha')"
          test "$created_sha" = "$GITHUB_SHA"
          gh release create v1.4.0 --draft --verify-tag --target "$GITHUB_SHA" --title 'RefurbCheck 1.4.0 · 실행부터 검사·조치·재확인까지' --notes-file docs/release-notes-1.4.0.md
          gh release upload v1.4.0 release/RefurbCheck-1.4.0.apk release/RefurbCheck-1.4.0.apk.sha256 release/signing-certificate-sha256-1.4.0.txt release/source-file-sha256-1.4.0.json data/catalog-updates/catalog-update.zip "$RUNNER_TEMP/RefurbCheck-1.4.0-source.zip"
          # Publishing is a separate user-approved step after reviewing results.
          gh release view v1.4.0 --json url,isDraft,tagName
