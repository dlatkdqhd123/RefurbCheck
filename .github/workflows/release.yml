name: Publish verified RefurbCheck 1.2.0
on:
  push:
    branches: ['release/1.2.0']
permissions:
  contents: read
concurrency:
  group: refurbcheck-release-v1.2.0
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'dlatkdqhd123/RefurbCheck' && github.ref == 'refs/heads/release/1.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      REFURBCHECK_APK_SHA256: 'addf557694e94e499f4409b764ccc0780629f137e1e6494ce5eb357e6d51be8c'
      REFURBCHECK_CERT_SHA256: '31a3041c7933acb7cdafad342bb574f0726f6045ddf5ccf4d9fd3fc7f1f126ff'
      REFURBCHECK_MANIFEST_SHA256: '07c7f3bbf75377cc317072c4d7191b97fcca7afbbdf641f00c03b821d669c97f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned APK and source manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd().resolve()
          release = root / 'release'
          apk_sha = os.environ['REFURBCHECK_APK_SHA256']
          cert_sha = os.environ['REFURBCHECK_CERT_SHA256']
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          apk = release / 'RefurbCheck-1.2.0.apk'
          if digest(apk) != apk_sha:
              raise SystemExit('APK differs from the verified release')
          checksum = (release / 'RefurbCheck-1.2.0.apk.sha256').read_text().splitlines()
          if checksum != [f'{apk_sha}  RefurbCheck-1.2.0.apk']:
              raise SystemExit('Unexpected APK checksum file')
          if (release / 'signing-certificate-sha256.txt').read_text().strip() != cert_sha:
              raise SystemExit('Unexpected signing certificate fingerprint file')
          manifest_path = release / 'source-file-sha256.json'
          if digest(manifest_path) != os.environ['REFURBCHECK_MANIFEST_SHA256']:
              raise SystemExit('Source manifest differs from the reviewed release')
          manifest = json.loads(manifest_path.read_text())
          if manifest['apkSha256'] != apk_sha or manifest['signingCertificateSha256'] != cert_sha:
              raise SystemExit('Source manifest does not identify the pinned APK')
          for relative, expected in manifest['files'].items():
              path = (root / relative).resolve()
              if not path.is_relative_to(root) or not path.is_file() or digest(path) != expected:
                  raise SystemExit(f'Reviewed source input mismatch: {relative}')
          print(f'Pinned APK and {len(manifest["files"])} reviewed source files verified')
          PY
      - name: Verify APK signature
        run: |
          set -euo pipefail
          refurbcheck_signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$refurbcheck_signer" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$refurbcheck_signer" verify --verbose --print-certs release/RefurbCheck-1.2.0.apk > "$RUNNER_TEMP/refurbcheck-signature.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          lines = (Path(os.environ['RUNNER_TEMP']) / 'refurbcheck-signature.txt').read_text().splitlines()
          expected = os.environ['REFURBCHECK_CERT_SHA256']
          required = [
              f'Signer #1 certificate SHA-256 digest: {expected}',
              'Number of signers: 1',
              'Verified using v2 scheme (APK Signature Scheme v2): true',
              'Verified using v3 scheme (APK Signature Scheme v3): true',
          ]
          if any(line not in lines for line in required):
              raise SystemExit('Unexpected APK signature or signer')
          print('Pinned single-signer APK v2/v3 signatures verified')
          PY
      - name: Archive this exact source commit
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=RefurbCheck-1.2.0/ --output="$RUNNER_TEMP/RefurbCheck-1.2.0-source.zip" "$GITHUB_SHA"
      - name: Create new draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing_release="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.2.0") | .id')"
          existing_tag="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v1.2.0" --jq '.[] | select(.ref == "refs/tags/v1.2.0") | .ref')"
          if [ -n "$existing_release" ] || [ -n "$existing_tag" ]; then
            printf '%s\n' '::error::v1.2.0 already exists; refusing to replace a release or tag.'
            exit 1
          fi
          # Create only: a competing tag creation fails instead of moving an existing ref.
          created_tag_sha="$(gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.2.0' -f "sha=$GITHUB_SHA" --jq '.object.sha')"
          test "$created_tag_sha" = "$GITHUB_SHA"
          gh release create v1.2.0 --draft --verify-tag --target "$GITHUB_SHA" --title 'RefurbCheck 1.2.0 · 리퍼폰 점검' --notes-file docs/release-notes-1.2.0.md
          # No clobber, deletion, or force update. On failure leave the new draft/tag for inspection.
          gh release upload v1.2.0 release/RefurbCheck-1.2.0.apk release/RefurbCheck-1.2.0.apk.sha256 release/signing-certificate-sha256.txt "$RUNNER_TEMP/RefurbCheck-1.2.0-source.zip"
          current_tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/v1.2.0" --jq '.object.sha')"
          test "$current_tag_sha" = "$GITHUB_SHA"
          gh release edit v1.2.0 --draft=false --verify-tag
          gh release view v1.2.0 --json url,isDraft,tagName
