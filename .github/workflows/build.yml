name: Build and test Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper
        run: |
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Ensure Android test platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Parser and report regression tests
        run: |
          bash tests/run_attestation_tests.sh
          bash tests/run_report_tests.sh
          bash tests/run_apk_tests.sh
          bash tests/run_remediation_tests.sh
          bash tests/run_malware_tests.sh
          bash tests/run_malware_remediation_tests.sh
          mkdir -p build/signal-tests
          javac -encoding UTF-8 -d build/signal-tests app/src/main/java/io/github/refurbcheck/SignalRules.java tests/SignalRulesTest.java
          java -cp build/signal-tests io.github.refurbcheck.SignalRulesTest
      - name: Build test APK
        run: bash gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RefurbCheck-debug-for-testing-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
