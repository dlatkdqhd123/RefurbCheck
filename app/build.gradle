plugins { id 'com.android.application' }
android {
    namespace 'io.github.refurbcheck'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.refurbcheck'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        release {
            if (System.getenv('REFURBCHECK_KEYSTORE')) {
                storeFile file(System.getenv('REFURBCHECK_KEYSTORE'))
                storePassword System.getenv('REFURBCHECK_STORE_PASSWORD')
                keyAlias System.getenv('REFURBCHECK_KEY_ALIAS') ?: 'refurbcheck'
                keyPassword System.getenv('REFURBCHECK_KEY_PASSWORD') ?: System.getenv('REFURBCHECK_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('REFURBCHECK_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}
dependencies { implementation files('libs/apksig-android-4.4.0.jar') }
tasks.register('verifyBundledDependencies') {
    doLast {
        def bundled = file('libs/apksig-android-4.4.0.jar')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(bundled.bytes).encodeHex().toString()
        if (actual != '530fcc4384889108bf85b4c816cfe354604dd38654b30d81fc046a817e1c10e0') {
            throw new GradleException('Pinned apksig-android dependency digest mismatch')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyBundledDependencies') }
